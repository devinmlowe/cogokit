[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogopro"
version = "0.3.0"
description = "Python reimplementation of COGO+ Pro surveying/coordinate geometry software"
requires-python = ">=3.11"
dependencies = ["typer>=0.9"]

[project.scripts]
cogopro = "cogopro.cli:app"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
lsa = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
