[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogokit"
version = "0.3.0"
description = "Coordinate geometry, traverse adjustment, geodetic projections and surveying calculations for Python (CLI + TUI)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{name = "Devin Lowe"}]
keywords = ["surveying", "cogo", "coordinate-geometry", "geodesy", "state-plane", "landxml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: GIS",
    "Operating System :: OS Independent",
]
dependencies = ["typer>=0.9"]

[project.urls]
Homepage = "https://github.com/devinmlowe/cogokit"
Repository = "https://github.com/devinmlowe/cogokit"
Issues = "https://github.com/devinmlowe/cogokit/issues"

[project.scripts]
cogokit = "cogokit.cli:app"
cogokit-tui = "cogokit.tui:run"

[project.optional-dependencies]
dev = ["pytest", "ruff>=0.16,<0.17"]
ifc = ["ifcopenshell>=0.7"]
lsa = ["numpy>=1.24"]
tui = ["textual>=0.75", "textual-plotext>=1.0"]

[tool.setuptools.package-data]
cogokit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Package __init__ modules re-export their public API; unused-import does not apply.
"__init__.py" = ["F401"]
