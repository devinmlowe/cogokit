[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cogokit"
version = "0.3.0"
description = "Python reimplementation of COGO+ Pro surveying/coordinate geometry software"
requires-python = ">=3.11"
dependencies = ["typer>=0.9"]

[project.scripts]
cogokit = "cogokit.cli:app"
cogokit-tui = "cogokit.tui:run"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
ifc = ["ifcopenshell>=0.7"]
lsa = ["numpy>=1.24"]
tui = ["textual>=0.75", "textual-plotext>=1.0"]

[tool.setuptools.package-data]
cogokit = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
